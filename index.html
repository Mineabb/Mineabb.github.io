<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Score App</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/score.css">
    <link rel="stylesheet" href="css/toast.css">
</head>

<body>

    <div id="app">

        <!-- Login Page -->
        <section id="loginPage" class="page">

            <div class="login-container">

                <h1>Score App</h1>

                <p class="login-subtitle">
                    Teacher Login
                </p>

                <form id="loginForm">

                    <div class="form-group">
                        <label for="teacherCode">
                            <i class="fa-solid fa-chalkboard-user"></i>
                            Teacher Code
                        </label>

                        <input
                            type="text"
                            id="teacherCode"
                            placeholder="e.g. 7A-Math"
                            autocomplete="username" 
                            required>
                            
                    </div>

                    <div class="form-group">
                        <label for="password">
                            <i class="fa-solid fa-lock"></i>
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter password"
                            required
                        >
                    </div>

                        <button id="loginButton" type="submit">
                            <i class="fa-solid fa-right-to-bracket"></i>
                            Login
                        </button>

                </form>

                <p id="loginMessage"></p>

            </div>

        </section>


        <!-- Score Page -->
        <section
    id="scorePage"
    class="page hidden"
>

    <div class="score-container">

        <header class="score-header">

            <div>
                <h1>Score Input</h1>

                <p>
                    Enter student scores
                </p>
            </div>

            
            <button
                id="logoutButton"
                type="button"
            >
                <i class="fa-solid fa-right-from-bracket"></i>
                Logout
            </button>

        </header>


        <!-- Filters -->

        <div class="score-filters">

            <div class="filter-group">

                <label for="scoreMonth">
                    <i class="fa-solid fa-calendar-days"></i>
                    Month
                </label>

                <select id="scoreMonth">

                </select>

            </div>


            <div class="filter-group">

                <label for="className">
                    <i class="fa-solid fa-users"></i>
                    Class
                </label>

                <input
                    type="text"
                    id="className"
                    readonly
                >

            </div>


            <div class="filter-group">

                <label for="subjectName">
                    <i class="fa-solid fa-book"></i>
                    Subject
                </label>

                <input
                    type="text"
                    id="subjectName"
                    readonly
                >

            </div>

        </div>


        <!-- Student Table -->

        <div class="student-table-container">

            <table id="studentTable">

                <thead>

                    <tr>
                        <th>
                            <i class="fa-solid fa-camera"></i>
                            Photo
                        </th>

                        <th>
                            <i class="fa-solid fa-id-card"></i>
                            Student ID
                        </th>

                        <th>
                            <i class="fa-solid fa-user"></i>
                            Student Name
                        </th>

                        <th id="scoreHeader">
                            <i class="fa-solid fa-star"></i>
                            Score
                        </th>
                    </tr>

                </thead>

                <tbody id="studentTableBody">

                    <!-- Students will appear here -->

                </tbody>

            </table>

        </div>
        

        <div class="score-actions">

            <button
                id="saveScoreButton"
                type="button"
            >
                <i class="fa-solid fa-floppy-disk"></i>
                Save Scores
            </button>

        </div>

    </div>

</section>

    </div>

    <script type="module" src="js/app.js"></script>

</body>

</html>
